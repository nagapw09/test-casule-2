namespace: test-casule

test-casule:
  defines: runnable
  containers:
    app:
      image: test-casule:latest
  services:
    http:
      container: app
      port: 8080
      protocol: tcp
      ingress-routes:
        web:
          path-prefix: /
  checks:
    readiness:
      code: http-get-service("test-casule/test-casule", "http", "/") get-member("status") 200 eq?
      period: 10
      initialDelay: 5
    liveness:
      code: http-get-service("test-casule/test-casule", "http", "/api/hello") get-member("status") 200 eq?
      period: 30
      initialDelay: 10

endpoints:
  defines: monkec/endpoints
  entrypoint: app
  connections:
    app:
      runnable: test-casule/test-casule
      service: http
  depends:
    wait-for:
      runnables:
        - test-casule/test-casule
      timeout: 120
  endpoints:
    app:
      url: <- "https://" connection-domain-name("app") concat-all
      description: Primary public URL for the test-casule application.

stack:
  defines: group
  members:
    - test-casule/test-casule
    - test-casule/endpoints